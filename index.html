<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>2点間以上の直線距離を表示する地図</title>
    <link rel="stylesheet" href="manyPoints_map_style_plus.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.0/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.3.0/dist/leaflet.js"></script>

    <script src="Control.OSMGeocoder.js"></script>
    <link rel="stylesheet" href="Control.OSMGeocoder.css" />

    <script>
        let map;
        let lines;
        let markers = [];
        let lastDragTime = 0;
        let ignoreNextMapClick = false;

        // アニメーション用の変数
        let position = 0;
        let animationId = null; //アニメーション用のタイマー
        let runningSection = 0; // 現在走っている区間用
        let speed = 1; //速度
        let isMoving = false; //移動中かのフラグ
        let curMarker=null;
        let smoothRoute = [];
        let trail;

        //アニメーション用画像の詳細設定（車）
        const iconImage = L.icon({
            iconUrl: "/images/blueCarFree.png",
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        // 地名検索コントロールの設定をまとめる
        var option = {
            position: 'topright', // 表示位置
            text: '検索',         // ボタンの文字
            placeholder: '検索条件を入力してください'
        };

        function init() {
            map = L.map('mapcontainer', { zoomControl: false });
            const mpoint = [35.62615742933233, 139.72359009529535]; //五反田駅
            map.setView(mpoint, 15);

            // オープンストリートマップver
            // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            //     { attribution: "<a href='http://osm.org/copyright' target='_blank'>OpenStreetMap</a>" }).addTo(map);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
            }).addTo(map);

            // 検索コントロールを作成して地図に追加
            const osmGeocoder = new L.Control.OSMGeocoder(option);
            map.addControl(osmGeocoder);

            // 地図のクリック処理
            map.on('click', function (e) {

                // ドラッグ直後のクリックなら無視
                if (ignoreNextMapClick) {
                    ignoreNextMapClick = false;
                    return;
                }

                onMapClick(e);
            });

            document.getElementById("resetButton")
                .addEventListener("click", function (e) {
                    L.DomEvent.stopPropagation(e);
                    resetMap();
                });

            // 一時停止
            document.getElementById("pause")
                .addEventListener("click",function(e){
                    L.DomEvent.stopPropagation(e);
                    if (isMoving === true){
                        stopMoving();}
                    else{
                        continuation();}
                })
        };


        function onMapClick(e) {
            console.trace("onMapClick");
            let markerNo = markers.length + 1;
            let mk = L.marker(e.latlng, { draggable: true }).addTo(map);

            // マウスを乗せた時に表示する
            mk.bindTooltip("マーカー" + markerNo, {
                direction: "top",
                offset: [0, -10]
            });

            markers.push(mk);

            // マーカーがクリックされたら対象のマーカーを削除する
            mk.on('click', function (e) {
                console.log('click')
                //removeMarker(e)
                removeMarker(e)
            });

            // ドラッグ開始
            mk.on('dragstart', function () {
                console.log('dragstart')
                ignoreNextMapClick = true;
            });

            // ドラッグ終了
            // マーカーがドラッグ移動したら線を引きなおす
            mk.on('dragend', function () {
                console.log("dragend", markers.length);

                lastDragTime = Date.now();
                updateRoute();
            });

            updateRoute();
        }

        function removeMarker(e) {

            // 地図へのイベント伝播を止める
            //L.DomEvent.stopPropagation(e);
            let mk = e.target;
            map.removeLayer(mk);
            markers = markers.filter(function (marker) {
                return marker !== mk;
            });
            updateRoute();
        }

        function updateRoute() {
            // 一度線を削除する
            if (lines) {
                map.removeLayer(lines);
                lines = null;
            }

            // 残っているマーカーの座標を取得
            let points = [];

            for (let i = 0; i < markers.length; i++) {
                points.push(markers[i].getLatLng());
            }

            let totalDistance = 0;
            let msg = "";

            // マーカーが２つ以上あれば
            if (markers.length >= 2) {
                lines = L.polyline(points, {
                    color: "blue"
                }).addTo(map);

                // 隣り合うマーカーの距離を計算
                for (let i = 0; i < markers.length - 1; i++) {
                    let p1 = markers[i].getLatLng();
                    let p2 = markers[i + 1].getLatLng();

                    let distance = p1.distanceTo(p2);
                    totalDistance = totalDistance + distance;

                    msg = msg + "マーカー" + (i + 1) + "→マーカー" + (i + 2)
                        + "：" + distance.toFixed(0) + "m<br>";
                }

                msg += "<br><b>合計距離："
                    + totalDistance.toFixed(0) + "m</b>";
            } else {
                msg = "地図をクリックしてください";
            }

            // 距離情報を画面に表示
            document.getElementById("d2").innerHTML = msg;

            // アニメーションを動かす
            animationMovie();
        }

        function resetMap() {
            // 追加したマーカーをすべて削除
            markers.forEach(function (marker) {
                map.removeLayer(marker);
            });
            markers = [];

            // 線を削除する
            if (lines) {
                map.removeLayer(lines);
                lines = null;
            }
            // 距離情報を初期状態に戻す
            document.getElementById("d2").innerHTML = "地図をクリックしてください";
            animationMovie();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('ja-JP');
        }

        function animationMovie() {
            // 以前のアニメーションを停止
            stopMoving();
            // 以前の車と軌跡を削除
            if (curMarker) {
                map.removeLayer(curMarker);
                curMarker = null;
            }
            if (trail) {
                map.removeLayer(trail);
                trail = null;
            }

            // マーカーが2つ未満ならアニメーションしない
            //if (markers.length < 2) return;

            // マーカーから座標を取得
            const route = [];
            for (let i =0; i < markers.length; i++){
                const mk = markers[i]
                route.push(mk.getLatLng());
            }
             
            // ルートを補間して細かい座標に分割
            smoothRoute = interpolateRoute(route, 30);

            // 車を最初の位置に配置
            curMarker = L.marker(smoothRoute[0], {
                icon: iconImage
            }).addTo(map).bindPopup('移動中の車');

            // 軌跡を表示するポリライン
            trail = L.polyline([], {
                color: 'red',
                weight: 2,
                opacity: 0.8
            }).addTo(map);

            // 初期位置に戻す
            position = 0;

            // アニメーション開始
            isMoving = true;
            animate();
        }
        // 移動開始
        function startMoving() {
            if (isMoving) return;
            isMoving = true;
            animationMovie();
        }

        function animate() {
            // アニメーションが停止していたら終了
            if (!isMoving) return;

            // 車の位置を更新
            curMarker.setLatLng(smoothRoute[position]);
            // 軌跡を更新
            trail.setLatLngs(smoothRoute.slice(0, position + 1));
            // 次の座標へ進む
            position += 1;
            // 次のアニメーションを予約
            animationId = requestAnimationFrame(animate);
        }

        // 2点間を細かいステップに分割して滑らかな移動を実現
        function interpolateRoute(route, steps = 50) {
            const interpolated = [];

            for (let i = 0; i < route.length - 1; i++) {
                const start = route[i];
                const end = route[i + 1];

                for (let j = 0; j < steps; j++) {
                    const t = j / steps;
                    interpolated.push([
                        start.lat + (end.lat - start.lat) * t,
                        start.lng + (end.lng- start.lng) * t
                    ]);
                }
            }

            return interpolated;
        }

        // 再開
        function continuation(){
            isMoving = true;
            animate();
        }

        // 停止
        function stopMoving() {
            isMoving = false;

            if (animationId !== null) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        // リセット
        function resetPosition() {
            stopMoving();
            position = 0;
            curMarker.setLatLng()
        }

        // 速度更新(スライダー作成もする！)
        function updateSpeed(value) {
            speed = parseInt(value);
            document.getElementById('speedValue').textContent = Value;
        }

        // リスタート
        function restart(){
            // ルートの最後まで行ったら
        }

    </script>
</head>

<body onload="init()" style="margin:0;">
    
    <div id="header">
        <h1>2点間の合計直線距離を表示する</h1>
        <button id="continuation">再開</button>
        <button id="pause">一時停止</button>
        <div id="clock"></div>
    </div>

    <div id="mapcontainer">
        <!-- 地図の上に重なる情報 -->
        <div id="info">
            <button id="resetButton">
                リセット
            </button>
            <h3>距離情報</h3>
            <div id="d2">地図をクリックしてください</div>
        </div>
    </div> 

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('ja-JP');
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>

</html>
